name: txs

services:
  game:
    image: tangxiaoshi-game:latest
    container_name: tangxiaoshi-game
    # 机房约定：bridge 网络容器出站/互联 TCP 超时，新服务一律 host 网络。
    # 应用只监听 127.0.0.1:8090，由 cloudflared（grokbot 隧道）对外暴露。
    network_mode: host
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      PORT: "8090"
      NITRO_HOST: 127.0.0.1
      NITRO_PORT: "8090"
      # PGLite 落盘目录（卷挂载）：存档与账号数据在容器重启后保留。
      PGLITE_DATA_DIR: /app/data
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?在 deploy/.env 里配置 BETTER_AUTH_SECRET}
    volumes:
      - ./data:/app/data
